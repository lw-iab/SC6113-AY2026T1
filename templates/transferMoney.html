<!DOCTYPE html>
<html>
<head>
    <title>SC6113 DAPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Transfer Money</h2>
        <input type="text" id="payer" placeholder="Enter payer" required>
        <input type="text" id="payee" placeholder="Enter payee" required>
        <input type="text" id="amount" placeholder="Enter amount" required>

        <button class="btn" onclick="transfer()">Transfer</button>
        <button class="btn" onclick="transaction()">View Transaction</button>

        <p id="view Payer"></p>
        <p id="view Payee"></p>
        <p id="view Amount"></p>

        <form action="/main" method="POST">
            <input type="submit" value="Go Back">
        </form>

        <script src="https://cdn.jsdelivr.net/npm/web3@4.16.0/dist/web3.min.js"></script>

        <script>
            const contractAddress = "0x5bb9cd5e5cdfc630082afbdd17a229d4d7d2da89";
            const contractABI = [
                {
                "inputs": [
                    {
                    "internalType": "address",
                    "name": "payer_add",
                    "type": "address"
                    },
                    {
                    "internalType": "address",
                    "name": "payee_add",
                    "type": "address"
                    },
                    {
                    "internalType": "uint256",
                    "name": "amount_transfer",
                    "type": "uint256"
                    }
                ],
                "name": "transfer",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
                },
                {
                "inputs": [],
                "name": "transaction",
                "outputs": [
                    {
                    "internalType": "address",
                    "name": "",
                    "type": "address"
                    },
                    {
                    "internalType": "address",
                    "name": "",
                    "type": "address"
                    },
                    {
                    "internalType": "uint256",
                    "name": "",
                    "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
                }
            ];
            const web3 = new Web3(window.ethereum);
            const contract = new web3.eth.Contract(contractABI, contractAddress);

            async function transfer() {
                const accounts = await web3.eth.requestAccounts();
                const payer = document.getElementById("payer").value;
                const payee = document.getElementById("payee").value;
                const amount = document.getElementById("amount").value;
                console.log("Payer:", payer);
                console.log("Payee:", payee);
                console.log("Amount:", amount);
                
                console.log("Accounts[0]:", accounts[0]);
                await contract.methods.transfer(payer, payee, amount).send({ from: accounts[0] });
            }

            async function transaction() {
                const result = await contract.methods.transaction().call();
                document.getElementById("view Payer").innerText = `Payer: ${result[0]}`;
                document.getElementById("view Payee").innerText = `Payee: ${result[1]}`;
                document.getElementById("view Amount").innerText = `Amount: ${result[2]}`;
            }
        </script>
    </div>
</body>
</html>
